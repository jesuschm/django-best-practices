[project]
name = "django-best-practices"
version = "0.1.0"
description = "A Django example project showcasing best practices, modern architecture, and idiomatic framework usage."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.2",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "strawberry-graphql-django>=0.75.0",
]

[tool.setuptools]
packages = ["common"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
